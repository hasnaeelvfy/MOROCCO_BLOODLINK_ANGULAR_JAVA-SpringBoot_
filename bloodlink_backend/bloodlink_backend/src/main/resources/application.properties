spring.application.name=BloodLink Backend

server.port=${SERVER_PORT:8080}

# MySQL \u00e2\u0080\u0094 set DB_URL, DB_USERNAME and DB_PASSWORD in the environment.
# Create the schema bloodlink_db yourself. This app does not create it.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3309/bloodlink_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT \u00e2\u0080\u0094 override JWT_SECRET in every non-local environment.
bloodlink.jwt.secret=${JWT_SECRET:change-this-dev-secret-key-must-be-at-least-32-chars}
bloodlink.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
bloodlink.jwt.issuer=${JWT_ISSUER:bloodlink}

bloodlink.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

bloodlink.uploads-dir=${UPLOADS_DIR:uploads}
bloodlink.admin.email=${ADMIN_EMAIL:admin@bloodlink.ma}
bloodlink.admin.password=${ADMIN_PASSWORD:AdminBloodLink1}
bloodlink.admin.bootstrap=${ADMIN_BOOTSTRAP:true}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
