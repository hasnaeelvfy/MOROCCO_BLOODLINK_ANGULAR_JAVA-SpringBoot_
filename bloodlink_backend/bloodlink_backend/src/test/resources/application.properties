spring.datasource.url=jdbc:h2:mem:bloodlink_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

bloodlink.jwt.secret=change-this-dev-secret-key-must-be-at-least-32-chars
bloodlink.jwt.expiration-ms=3600000
bloodlink.jwt.issuer=bloodlink
bloodlink.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
bloodlink.uploads-dir=target/test-uploads
bloodlink.admin.bootstrap=false
