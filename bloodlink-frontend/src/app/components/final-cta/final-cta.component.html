<section class="section final" id="join">
  <canvas #drop class="final-canvas" aria-hidden="true"></canvas>
  <div class="final-inner reveal">
    <p class="eyebrow eyebrow--center">{{ 'finalCta.eyebrow' | t }}</p>
    <h2>{{ 'finalCta.headline' | t }} <span class="accent">{{ 'finalCta.headlineAccent' | t }}</span></h2>
    <p class="lead">
      {{ 'finalCta.lead' | t }}
    </p>
    <div class="actions actions--center">
      <a class="button magnetic" routerLink="/donor/auth">{{ 'cta.becomeDonor' | t }} <span aria-hidden="true">↗</span></a>
      <a class="button button--ghost" href="#top">{{ 'finalCta.explore' | t }} <span aria-hidden="true">↑</span></a>
    </div>
  </div>
</section>
